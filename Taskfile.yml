version: '3'

vars:
  GOBIN:
    sh: go env GOPATH

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the server binary
    cmds:
      - go build -o bin/server ./cmd/server

  run:
    desc: Run the server (HTTP mode)
    cmds:
      - go run cmd/server/main.go

  run:tls:
    desc: Run the server with HTTPS (TLS fingerprinting enabled)
    env:
      PORT: "8443"
      TLS_CERT: "certs/bot.local.crt"
      TLS_KEY: "certs/bot.local.key"
    cmds:
      - go run cmd/server/main.go

  run:dual:
    desc: Run the server with both HTTP and HTTPS (HTTP :8080, HTTPS :8443)
    env:
      PORT: "8080"
      TLS_PORT: "8443"
      TLS_CERT: "certs/bot.local.crt"
      TLS_KEY: "certs/bot.local.key"
    cmds:
      - go run cmd/server/main.go

  build:prod:
    desc: Build server binary for Linux (production deploy)
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -ldflags="-s -w" -o bin/server ./cmd/server

  test:
    desc: Run all tests (internal, tests, tools, and any other packages)
    cmds:
      - go test ./... -v

  test:short:
    desc: Run tests (short mode)
    cmds:
      - go test ./... -short

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./... && echo "Lint passed"

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  check:
    desc: Run all checks (fmt, lint, test)
    cmds:
      - task: fmt
      - task: lint
      - task: test:short

  setup:
    desc: Install development tools
    cmds:
      - go install github.com/go-task/task/v3/cmd/task@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

  integration:
    desc: Run integration tests against running server (curl-based)
    vars:
      BASE_URL: '{{.BASE_URL | default "http://localhost:8080"}}'
    cmds:
      - cmd: |
          {{if eq OS "windows"}}powershell -ExecutionPolicy Bypass -File ./tools/shell/integration_test.ps1 {{.BASE_URL}}{{else}}./tools/shell/integration_test.sh {{.BASE_URL}}{{end}}

  integration:tls:
    desc: Run integration tests against HTTPS server (curl-based, skip cert verification)
    vars:
      BASE_URL: '{{.BASE_URL | default "https://localhost:8443"}}'
    cmds:
      - cmd: |
          {{if eq OS "windows"}}powershell -ExecutionPolicy Bypass -File ./tools/shell/integration_test.ps1 {{.BASE_URL}} -SkipCertCheck{{else}}./tools/shell/integration_test.sh {{.BASE_URL}} --insecure{{end}}

  bench:
    desc: Run HTTP benchmark (pass URL to test different routes, e.g. URL=http://localhost:8080/path or task bench -- http://localhost:8080/path)
    vars:
      URL: '{{or .URL .CLI_ARGS "http://localhost:8080/"}}'
      DURATION: '{{.DURATION | default "10s"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "10"}}'
    cmds:
      - go run ./tools/benchmark -url={{.URL}} -duration={{.DURATION}} -c={{.CONCURRENCY}}

  bench:tls:
    desc: Run HTTP benchmark over HTTPS (pass URL to test different routes, e.g. URL=https://localhost:8443/path or task bench:tls -- https://localhost:8443/path)
    vars:
      URL: '{{or .URL .CLI_ARGS "https://localhost:8443/"}}'
      DURATION: '{{.DURATION | default "10s"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "10"}}'
    cmds:
      - go run ./tools/benchmark -url={{.URL}} -duration={{.DURATION}} -c={{.CONCURRENCY}} -insecure

  deploy:build:
    desc: Alias for build:prod (build for Linux deploy)
    cmds:
      - task: build:prod
