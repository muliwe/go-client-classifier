<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <!-- terminal window -->
  <rect width="32" height="32" rx="3" fill="#0d1117"/>
  <rect x="4" y="4" width="24" height="5" rx="1" fill="#21262d"/>
  <!-- lines (green) -->
  <rect x="6" y="13" width="14" height="2" rx="0.5" fill="#3fb950"/>
  <rect x="6" y="17" width="10" height="2" rx="0.5" fill="#3fb950"/>
  <!-- prompt ">" -->
  <polygon points="6,22 10,20 10,24" fill="#3fb950"/>
  <!-- cursor block -->
  <rect x="12" y="21.5" width="2.5" height="3" fill="#3fb950"/>
</svg>
