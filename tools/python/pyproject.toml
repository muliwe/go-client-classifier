[tool.poetry]
name = "go-client-classifier-tools"
version = "0.1.0"
description = "Python tools for go-client-classifier (antibot tests, etc.)"
readme = "README.md"
authors = []
packages = [{ include = "scripts", from = "." }]

[tool.poetry.dependencies]
python = "^3.12"
curl-cffi = "^0.14"
pandas = "^2.0"
numpy = "^2.0"
tqdm = "^4.66"
matplotlib = "^3.8"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0"
black = "25.12.0"
isort = "7.0.0"

[tool.poetry.scripts]
lint = "scripts.run_lint:main"

[tool.black]
line_length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
